<style>
  :root {
      --bg: #10110f;
      --panel: #191b17;
      --text: #f2f2e9;
      --muted: #a4a69a;
      --accent: #d7ff3f;
      --line: rgba(242,242,233,.15);
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(var(--max), calc(100% - 44px)); margin: 0 auto; }
    .nav {
      min-height: 82px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line); gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 900; letter-spacing: -.06em; }
    .brand-mark {
      display: grid; place-items: center; width: 46px; height: 46px; flex: 0 0 46px;
      background: transparent !important; background-color: transparent !important; box-shadow: none !important; border: 0 !important; transform: none; overflow: visible;
    }
    .brand-mark img {
      display: block; width: 100%; height: 100%; object-fit: contain;
      background: transparent !important; background-color: transparent !important; border: 0 !important; box-shadow: none !important;
      transform: none; padding: 0;
    }
    .brand-name { font-size: 16px; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 27px; color: var(--muted); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; }
    .nav-links a:hover, .social a:hover { color: var(--accent); }
    .nav-cta { border: 1px solid var(--line); padding: 10px 14px; color: var(--text) !important; }
    .hero { padding: clamp(72px, 12vw, 150px) 0 88px; position: relative; overflow: hidden; }
    .hero-logo {
      position: absolute; right: 0; top: 4%; width: clamp(190px, 32vw, 420px);
      max-height: 360px; object-fit: contain; opacity: .16; z-index: 0; pointer-events: none;
    }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 850; letter-spacing: .2em; text-transform: uppercase; }
    h1 { position: relative; z-index: 1; margin: 23px 0 22px; max-width: 900px; font-size: clamp(54px, 10vw, 126px); line-height: .88; letter-spacing: -.085em; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    .hero-bottom { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-top: 40px; }
    .hero-copy { max-width: 390px; color: var(--muted); font-size: 15px; }
    .hero-copy strong { color: var(--text); font-weight: 700; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 18px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-secondary { border: 1px solid var(--line); }
    .ticker { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; }
    .ticker-inner { display: flex; justify-content: space-between; gap: 22px; padding: 15px 0; color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .2em; }
    .ticker b { color: var(--accent); }
    section { padding: 90px 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .section-kicker { color: var(--accent); font-size: 10px; font-weight: 850; letter-spacing: .2em; text-transform: uppercase; }
    h2 { margin: 8px 0 0; font-size: clamp(34px, 5vw, 60px); line-height: .98; letter-spacing: -.07em; text-transform: uppercase; }
    .section-note { max-width: 270px; color: var(--muted); font-size: 13px; }
    .roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

    .roster-groups { display: grid; gap: 2px; }
    /* Each roster role is a section element, so reset the site's generic section padding here. */
    .roster-group { padding: 8px 0; margin: 0; }
    .roster-group-title { display: flex; align-items: center; gap: 13px; margin: 0 0 6px; font-size: 12px; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    .roster-group-title:after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .roster-group-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .member { min-width: 0; padding: 12px; border: 1px solid var(--line); background: var(--panel); }
    .member-name { margin: 0 0 8px; font-size: 15px; font-weight: 850; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .member-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-links a { border: 1px solid var(--line); padding: 6px 8px; color: var(--muted); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .1em; }
    .member-links a:hover { color: var(--accent); border-color: var(--accent); }
    .member-links .missing-link { opacity: .5; }

    .player {
      min-height: 265px; position: relative; display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; transition: border-color .2s, transform .2s;
    }
    .player:hover { border-color: var(--accent); transform: translateY(-3px); }
    .player:before { content: ""; position: absolute; width: 180px; height: 180px; right: -50px; bottom: -65px; border: 1px solid rgba(215,255,63,.17); transform: rotate(35deg); }
    .player-top, .player-bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: start; gap: 15px; }
    .player-number { color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .14em; }
    .player-role { border: 1px solid var(--line); color: var(--muted); padding: 5px 8px; font-size: 9px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .player-symbol { position: absolute; inset: 42px 0 auto; text-align: center; color: rgba(215,255,63,.12); font-size: 104px; font-weight: 1000; letter-spacing: -.1em; }
    .player h3 { margin: 0; font-size: clamp(21px, 2.3vw, 29px); line-height: 1; letter-spacing: -.06em; text-transform: uppercase; }
    .player p { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .roster-help { margin-top: 18px; color: var(--muted); font-size: 11px; }
    .manifesto { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 45px 0; }
    .manifesto h2 { max-width: 550px; }
    .manifesto-copy { color: var(--muted); font-size: 15px; max-width: 450px; align-self: end; }
    .manifesto-copy strong { color: var(--text); }
    .social-panel { background: var(--accent); color: var(--bg); padding: 35px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .social-panel h2 { font-size: clamp(28px, 4vw, 46px); max-width: 520px; }
    .social { display: flex; flex-wrap: wrap; gap: 8px; }
    .social a { display: inline-flex; border: 1px solid rgba(16,17,15,.3); padding: 12px 14px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; }
    .social a:hover { background: var(--bg); color: var(--accent); }
    footer { padding: 28px 0; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .footer-inner strong { color: var(--text); }
    @media (max-width: 760px) {
      .wrap { width: min(var(--max), calc(100% - 30px)); }

      .nav-links { gap: 13px; font-size: 10px; }
      .nav-cta { padding: 8px 10px; }
      .hero { padding: 80px 0 62px; }
      .hero-logo { right: -22px; top: 0; width: 42vw; max-height: 250px; opacity: .16; }
      .hero-bottom, .section-head, .social-panel { align-items: flex-start; flex-direction: column; }
      .hero-bottom { gap: 22px; }
      section { padding: 65px 0; }
      .roster { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .roster-group-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .player { min-height: 220px; padding: 15px; }
      .player-symbol { font-size: 80px; }
      .manifesto { grid-template-columns: 1fr; gap: 20px; }
      .social-panel { padding: 25px; }
      .ticker-inner { flex-wrap: wrap; justify-content: flex-start; }
    }
    @media (max-width: 420px) {
      .brand-name { font-size: 13px; }
      .nav-links { gap: 8px; }
      .roster { grid-template-columns: 1fr; }
      .roster-group-grid { grid-template-columns: 1fr; }
      .player { min-height: 190px; }
      .footer-inner { align-items: flex-start; flex-direction: column; }
    }
  </style>
